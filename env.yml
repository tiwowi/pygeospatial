# ---- Project virtual environment ---------------------------------------------

name: pygeospatial
channels:
  - conda-forge
dependencies:
  - python=3.11

  # Core scientific stack
  - numpy
  - scipy=1.11.4
  - pandas
  - statsmodels

  # Geospatial stack
  - geopandas
  - shapely
  - pyproj
  - fiona
  - rasterio
  - rtree
  - geoviews
  - cartopy
  - contextily

  # Plotting
  - matplotlib
  - seaborn
  - geoplot
  - geopy

  # Full PySAL ecosystem
  - pysal
  - libpysal
  - esda
  - spreg
  - segregation
  - spopt
  - spvcm
  - tobler
  - splot

  # Jupyter
  - jupyterlab
  - ipykernel

  # Optional utilities
  - pip
  - pip:
      - mapclassify

  # Sample data 
  - census
